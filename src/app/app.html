<div class="flex min-h-screen flex-col overflow-x-hidden bg-base-100 text-base-content text-[15px]">

  <!-- Barra superior -->
  <header class="border-b border-base-300">
    <div class="navbar mx-auto max-w-350 flex-wrap gap-4 px-4 sm:px-6">
      <div class="navbar-start">
        <span class="text-[28px] font-bold italic tracking-tight text-primary">
          Infrashield Systems
        </span>
      </div>
    </div>
  </header>

  <!-- Navegación -->
  <nav class="border-b border-base-300" aria-label="Navegación principal">
    <div class="mx-auto max-w-[1400px] px-4 sm:px-6">
      <ul class="menu menu-horizontal w-full flex-wrap justify-between gap-2 py-3 text-[#0a3d6b]">
        <li>
          <a
            routerLink="/"
            routerLinkActive="menu-active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }">
            Inicio
          </a>
        </li>
        <li>
          <a
            routerLink="/quienes-somos"
            routerLinkActive="menu-active"
            ariaCurrentWhenActive="page">
            Quienes somos
          </a>
        </li>
        <li>
          <a
            routerLink="/nuestros-productos"
            routerLinkActive="menu-active"
            ariaCurrentWhenActive="page">
            Nuestros productos
          </a>
        </li>
        <li>
          <a routerLink="/servicios" routerLinkActive="menu-active" ariaCurrentWhenActive="page">
            Servicios
          </a>
        </li>
        <li>
          <a
            routerLink="/contactanos"
            routerLinkActive="menu-active"
            ariaCurrentWhenActive="page">
            Contáctanos
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="mx-auto w-full max-w-350 flex-1 px-4 pt-10 pb-6 sm:px-6 sm:pt-12">
    <router-outlet />
  </main>

  <app-footer />

</div>
