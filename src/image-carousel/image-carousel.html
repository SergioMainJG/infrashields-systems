<section 
  class="relative w-full overflow-hidden rounded-box border border-base-300 bg-base-100 shadow-md transition-shadow hover:shadow-lg"
  (mouseenter)="pauseAutoPlay()"
  (mouseleave)="resumeAutoPlay()"
  aria-roledescription="carousel"
  aria-label="Destacados Infrashield Systems">

  <!-- DaisyUI Carousel Container -->
  <div 
    #carouselElement
    (scroll)="onScroll($event)"
    class="carousel w-full h-[320px] sm:h-[400px] lg:h-[480px] scroll-smooth">
    
    @for (slide of slides; track slide.id; let i = $index) {
      <div 
        [id]="slide.id" 
        class="carousel-item relative w-full flex items-center justify-start overflow-hidden">
        
        <!-- Background Slide Image: only the first (LCP) slide loads eagerly with high priority; the rest lazy-load as the user scrolls the carousel -->
        <img
          [ngSrc]="slide.image"
          [alt]="slide.alt"
          fill
          [priority]="i === 0"
          class="object-cover object-center transition-transform duration-700 hover:scale-105" />

        <!-- High-Contrast Scrim Gradient for Readability -->
        <div aria-hidden="true" class="absolute inset-0 bg-gradient-to-r from-base-100/95 via-base-100/80 to-transparent sm:w-3/4 lg:w-3/5"></div>
        <div aria-hidden="true" class="absolute inset-0 bg-radial from-transparent to-black/20"></div>

        <!-- Slide Content Overlay -->
        <div class="relative z-10 flex max-w-xl flex-col items-start justify-center gap-3 p-6 sm:p-10 lg:p-14">
          <span class="badge {{ slide.badgeClass }} badge-sm md:badge-md font-semibold tracking-wide uppercase shadow-sm">
            {{ slide.tag }}
          </span>

          <h2 class="text-xl font-bold leading-tight tracking-tight text-base-content sm:text-2xl lg:text-3xl">
            {{ slide.title }}
          </h2>

          <p class="text-sm font-medium text-primary sm:text-base">
            {{ slide.subtitle }}
          </p>

          <p class="hidden text-xs text-base-content/80 sm:block sm:text-sm line-clamp-2 max-w-md">
            {{ slide.description }}
          </p>

          <a
            [routerLink]="slide.ctaLink"
            class="btn btn-primary btn-sm sm:btn-md mt-2 gap-2 shadow hover:shadow-md transition-all">
            {{ slide.ctaText }}
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    }
  </div>

  <!-- Left / Right Navigation Buttons (daisyUI btn-circle) -->
  <div class="pointer-events-none absolute inset-y-0 left-0 right-0 flex items-center justify-between px-3 sm:px-5 z-20">
    <button 
      (click)="prevSlide()" 
      type="button"
      class="pointer-events-auto btn btn-circle btn-sm sm:btn-md bg-base-100/80 hover:bg-base-100 text-base-content border border-base-300 shadow-lg backdrop-blur transition-transform active:scale-95"
      aria-label="Diapositiva anterior">
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>
    <button 
      (click)="nextSlide()" 
      type="button"
      class="pointer-events-auto btn btn-circle btn-sm sm:btn-md bg-base-100/80 hover:bg-base-100 text-base-content border border-base-300 shadow-lg backdrop-blur transition-transform active:scale-95"
      aria-label="Diapositiva siguiente">
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </button>
  </div>

  <!-- Bottom Indicators / Dots Navigation -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 z-20 bg-base-100/70 px-3 py-1.5 rounded-full backdrop-blur-sm border border-base-300/60 shadow-sm">
    @for (slide of slides; track slide.id; let i = $index) {
      <button 
        (click)="goToSlide(i)" 
        type="button"
        [class]="'h-2.5 rounded-full transition-all duration-300 ' + (currentIndex() === i ? 'w-7 bg-primary' : 'w-2.5 bg-base-content/30 hover:bg-base-content/50')"
        [attr.aria-label]="'Ir a diapositiva ' + (i + 1)"
        [attr.aria-current]="currentIndex() === i ? 'true' : null">
      </button>
    }
  </div>

</section>
